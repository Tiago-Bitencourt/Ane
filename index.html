<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrator de Dados PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="container">

    <div class="upload-sections-wrapper">
      <section class="upload-card">
        <h3><i class="fas fa-file-pdf"></i> Extrair Dados do PDF</h3>
        <p><i class="fas fa-info-circle"></i> Selecione um arquivo PDF para extrair os dados da tabela</p>
        <div class="file-input-wrapper">
          <label for="pdfFile" class="file-input-label">
            <i class="fas fa-upload"></i>
            <span>Selecionar Arquivo PDF</span>
          </label>
          <input type="file" id="pdfFile" accept=".pdf,application/pdf">
        </div>
        <div id="pdfStatus" class="upload-status"></div>
      </section>

      <section class="upload-card">
        <h3><i class="fas fa-file-csv"></i> Preencher CSV</h3>
        <p><i class="fas fa-info-circle"></i> Faça upload de um CSV e preencha automaticamente com os dados do PDF</p>
        <div class="file-input-wrapper">
          <label for="csvFile" class="file-input-label">
            <i class="fas fa-file-upload"></i>
            <span>Selecionar Arquivo CSV</span>
          </label>
          <input type="file" id="csvFile" accept=".csv,text/csv">
        </div>
        <div id="csvStatus" class="upload-status"></div>
      </section>
    </div>

    <div class="process-section">
      <button type="button" id="processCSVBtn" class="button" disabled>
        <i class="fas fa-magic"></i>
        <span>Processar e Baixar CSV</span>
      </button>
      <p><i class="fas fa-info-circle"></i> <span>Após selecionar o PDF e o CSV, clique aqui para processar</span></p>
    </div>
  </main>

  <div id="output" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/pdf-ocr.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
